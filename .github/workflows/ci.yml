name: FitOS CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run TrainingEngine tests
        run: swift test

      - name: Validate beta release metadata
        run: |
          plutil -lint App/PrivacyInfo.xcprivacy
          plutil -lint App/FitOS.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit' App/FitOS.entitlements)" = 'true'
          grep -Eq 'MARKETING_VERSION: "[0-9]+\.[0-9]+\.[0-9]+"' project.yml
          grep -Eq 'CURRENT_PROJECT_VERSION: "[0-9]+"' project.yml
          grep -q 'FITOS_CLOUD_ACCOUNTS_ENABLED: "NO"' project.yml
          grep -q 'NSPrivacyAccessedAPICategoryUserDefaults' App/PrivacyInfo.xcprivacy
          grep -q 'CA92.1' App/PrivacyInfo.xcprivacy

      - name: Validate App Store icon
        run: |
          ICON='App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
          test -f "$ICON"
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon' project.yml
          grep -q '"filename" : "AppIcon-1024.png"' App/Assets.xcassets/AppIcon.appiconset/Contents.json
          test "$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')" = '1024'
          test "$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')" = '1024'
          test "$(sips -g hasAlpha "$ICON" | awk '/hasAlpha/ {print $2}')" = 'no'

      - name: Validate local fitness data is excluded from device backup
        run: |
          grep -q 'values.isExcludedFromBackup = true' App/Persistence/LocalDataProtection.swift
          for FILE in \
            App/Persistence/ProfilePersistence.swift \
            App/Persistence/WorkoutPersistence.swift \
            App/Persistence/NutritionPersistence.swift \
            App/Persistence/ActiveWorkoutPersistence.swift \
            App/Persistence/WorkoutFeedbackPersistence.swift \
            App/Persistence/WorkoutPlanAdherencePersistence.swift
          do
            grep -q 'LocalDataProtection.protectExistingFile' "$FILE"
            grep -q 'LocalDataProtection.write' "$FILE"
            ! grep -q 'data.write(to: fileURL' "$FILE"
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project FitOS.xcodeproj \
            -scheme FitOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone archive
        run: |
          rm -rf build/FitOS.xcarchive
          xcodebuild \
            -project FitOS.xcodeproj \
            -scheme FitOS \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/FitOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Validate archived app metadata
        run: |
          PLIST='build/FitOS.xcarchive/Products/Applications/FitOS.app/Info.plist'
          test -f "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = 'com.parmeshwars2911.FitOS'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = '0.1.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = '1'
          /usr/libexec/PlistBuddy -c 'Print :NSHealthShareUsageDescription' "$PLIST" | grep -q 'Apple Health'
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$PLIST")" = 'false'
