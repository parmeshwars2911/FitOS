name: FitOS CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run TrainingEngine tests
        run: swift test

      - name: Validate beta release metadata
        run: |
          plutil -lint App/PrivacyInfo.xcprivacy
          grep -Eq 'MARKETING_VERSION: "[0-9]+\.[0-9]+\.[0-9]+"' project.yml
          grep -Eq 'CURRENT_PROJECT_VERSION: "[0-9]+"' project.yml
          grep -q 'FITOS_CLOUD_ACCOUNTS_ENABLED: "NO"' project.yml
          grep -q 'NSPrivacyAccessedAPICategoryUserDefaults' App/PrivacyInfo.xcprivacy
          grep -q 'CA92.1' App/PrivacyInfo.xcprivacy

      - name: Validate App Store icon
        run: |
          ICON='App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
          test -f "$ICON"
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon' project.yml
          grep -q '"filename" : "AppIcon-1024.png"' App/Assets.xcassets/AppIcon.appiconset/Contents.json
          test "$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')" = '1024'
          test "$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')" = '1024'
          test "$(sips -g hasAlpha "$ICON" | awk '/hasAlpha/ {print $2}')" = 'no'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project FitOS.xcodeproj \
            -scheme FitOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
