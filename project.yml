name: FitOS

options:
  bundleIdPrefix: com.parmeshwars2911
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.10

targets:
  FitOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources/TrainingEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parmeshwars2911.FitOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

schemes:
  FitOS:
    build:
      targets:
        FitOS: all
    run:
      config: Debug
