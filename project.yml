name: FitOS

options:
  bundleIdPrefix: com.parmeshwars2911
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    FITOS_SUPABASE_URL: ""
    FITOS_SUPABASE_PUBLISHABLE_KEY: ""
    FITOS_CLOUD_ACCOUNTS_ENABLED: "NO"

targets:
  FitOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources/TrainingEngine
    dependencies:
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parmeshwars2911.FitOS
        PRODUCT_NAME: FitOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FitOS
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "FitOS reads selected Apple Health data to show body trends and recovery context for workout recommendations."
        INFOPLIST_KEY_FITOS_SUPABASE_URL: "$(FITOS_SUPABASE_URL)"
        INFOPLIST_KEY_FITOS_SUPABASE_PUBLISHABLE_KEY: "$(FITOS_SUPABASE_PUBLISHABLE_KEY)"
        INFOPLIST_KEY_FITOS_CLOUD_ACCOUNTS_ENABLED: "$(FITOS_CLOUD_ACCOUNTS_ENABLED)"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/FitOS.entitlements

schemes:
  FitOS:
    build:
      targets:
        FitOS: all
    run:
      config: Debug
